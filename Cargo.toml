[package]
name = "baud-forge"
version = "0.3.0"
edition = "2021"
description = "Open-source serial monitor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/siyal343/baud-forge"
readme = "README.md"

[[bin]]
name = "baud-forge"
path = "src/main.rs"

[lib]
name = "baud_forge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1

[workspace]
members = ["crates/bforge-hal", "crates/bforge-storage", "crates/bforge-framer", "crates/bforge-dissect", "crates/bforge-elf", "crates/bforge-script", "crates/bforge-core", "crates/bforge-cli", "crates/bforge-gui/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/siyal343/baud-forge"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1"
rtrb = "0.3"
crossbeam-channel = "0.5"
serialport = "4"
bforge-hal = { path = "crates/bforge-hal" }
bforge-storage = { path = "crates/bforge-storage" }
bforge-framer = { path = "crates/bforge-framer" }
bforge-dissect = { path = "crates/bforge-dissect" }
bforge-elf = { path = "crates/bforge-elf" }
bforge-script = { path = "crates/bforge-script" }
bforge-core = { path = "crates/bforge-core" }
