[workspace]
resolver = "2"
members = [
    "crates/bforge-hal",
    "crates/bforge-storage",
    "crates/bforge-framer",
    "crates/bforge-dissect",
    "crates/bforge-elf",
    "crates/bforge-script",
    "crates/bforge-core",
    "crates/bforge-cli",
    "crates/bforge-gui",
    "crates/bforge-gui-legacy/src-tauri",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/siyal343/baud-forge"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1"
rtrb = "0.3"
crossbeam-channel = "0.5"
serialport = "4"
bforge-hal = { path = "crates/bforge-hal" }
bforge-storage = { path = "crates/bforge-storage" }
bforge-framer = { path = "crates/bforge-framer" }
bforge-dissect = { path = "crates/bforge-dissect" }
bforge-elf = { path = "crates/bforge-elf" }
rustc-demangle = "0.1"
bforge-script = { path = "crates/bforge-script" }
bforge-core = { path = "crates/bforge-core" }

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
