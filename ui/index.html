<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaudForge — Hardware Engineering Workstation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Restore the persisted theme before first paint (no flash of default dark).
      try {
        var s = JSON.parse(localStorage.getItem('bforge_settings_v1') || '{}');
        document.documentElement.setAttribute(
          'data-bf-theme',
          ['obsidian', 'materials', 'skeuomorph', 'soft'].indexOf(s.theme) >= 0 ? s.theme : 'obsidian'
        );
        document.documentElement.setAttribute('data-bf-mode', s.themeMode === 'light' ? 'light' : 'dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bf-canvas text-bf-body antialiased select-none overflow-hidden h-screen w-screen m-0 p-0">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
