# Deploys the user documentation site (docs/site — committed static HTML) to
# GitHub Pages. Enable once: Settings → Pages → Source: "GitHub Actions".
# The site is pre-built (ui/scripts/build-docs.mjs renders docs/src/*.md), so
# this workflow only uploads it.
name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
