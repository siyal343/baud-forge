name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  lint:
    name: format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --exclude bforge-gui --all-targets --locked -- -D warnings

  ui:
    name: ui (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Upload the built frontend
        uses: actions/upload-artifact@v4
        with:
          name: bforge-ui
          path: ui/dist
          if-no-files-found: error

  desktop:
    name: desktop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the frontend
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the desktop shell
        run: cargo build -p bforge-gui --release --locked
      - name: Stage the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-app | Out-Null
          Copy-Item target/release/bforge-gui.exe dist-app/
          Copy-Item ui/dist -Destination dist-app/ui -Recurse
      - name: Upload the desktop app
        uses: actions/upload-artifact@v4
        with:
          name: bforge-desktop-windows
          path: dist-app
          if-no-files-found: error

  test:
    name: test (${{ matrix.name }})
    # A hung test used to block this job for as long as the runner allowed.
    # Twelve minutes is several times the slowest observed run.
    timeout-minutes: 12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-aarch64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
          # Public preview label. Remove this entry if GitHub does not offer it.
          - name: windows-aarch64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Build
        run: cargo build --workspace --exclude bforge-gui --locked
      - name: Test
        run: cargo test --workspace --exclude bforge-gui --locked
      - name: Run the headless CLI
        run: cargo run --locked -p bforge-cli -- version

      - name: Build the app
        run: cargo build --release --locked -p bforge-cli

      - name: Stage the app binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/bforge.exe ]; then
            cp target/release/bforge.exe "dist/bforge-${{ matrix.name }}.exe"
          else
            cp target/release/bforge "dist/bforge-${{ matrix.name }}"
          fi

      - name: Upload the app binary
        uses: actions/upload-artifact@v4
        with:
          name: bforge-${{ matrix.name }}
          path: dist/*
          retention-days: 7

  # macOS Intel has no hosted runner of its own any more. Cross-build the
  # x86_64 slice on the Apple Silicon runner instead.
  macos-intel:
    name: build (macos-x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build
        run: cargo build --workspace --exclude bforge-gui --locked --target x86_64-apple-darwin
      - name: Build the app
        run: cargo build --release --locked -p bforge-cli --target x86_64-apple-darwin
      - name: Stage the app binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/bforge dist/bforge-macos-x86_64
      - name: Upload the app binary
        uses: actions/upload-artifact@v4
        with:
          name: bforge-macos-x86_64
          path: dist/*
          retention-days: 7
