name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  lint:
    name: format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-aarch64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
          # Public preview label. Remove this entry if GitHub does not offer it.
          - name: windows-aarch64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Run the headless CLI
        run: cargo run --locked -p bforge-cli -- version

      - name: Build the app
        run: cargo build --release --locked -p bforge-cli

      - name: Stage the app binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/bforge.exe ]; then
            cp target/release/bforge.exe "dist/bforge-${{ matrix.name }}.exe"
          else
            cp target/release/bforge "dist/bforge-${{ matrix.name }}"
          fi

      - name: Upload the app binary
        uses: actions/upload-artifact@v4
        with:
          name: bforge-${{ matrix.name }}
          path: dist/*
          retention-days: 7

  # macOS Intel has no hosted runner of its own any more. Cross-build the
  # x86_64 slice on the Apple Silicon runner instead.
  macos-intel:
    name: build (macos-x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build
        run: cargo build --workspace --locked --target x86_64-apple-darwin
      - name: Build the app
        run: cargo build --release --locked -p bforge-cli --target x86_64-apple-darwin
      - name: Stage the app binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/bforge dist/bforge-macos-x86_64
      - name: Upload the app binary
        uses: actions/upload-artifact@v4
        with:
          name: bforge-macos-x86_64
          path: dist/*
          retention-days: 7
