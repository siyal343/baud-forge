name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  lint:
    name: format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.name }})
    timeout-minutes: 12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-aarch64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
          - name: windows-aarch64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Run the headless CLI
        run: cargo run --locked -p bforge-cli -- version

      - name: Build the app
        run: cargo build --release --locked -p bforge-cli

      - name: Stage the app binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/bforge.exe ]; then
            cp target/release/bforge.exe "dist/bforge-${{ matrix.name }}.exe"
          else
            cp target/release/bforge "dist/bforge-${{ matrix.name }}"
          fi

      - name: Upload the app binary
        uses: actions/upload-artifact@v4
        with:
          name: bforge-${{ matrix.name }}
          path: dist/*
          retention-days: 7

  macos-intel:
    name: build (macos-x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build
        run: cargo build --workspace --locked --target x86_64-apple-darwin
      - name: Build the app
        run: cargo build --release --locked -p bforge-cli --target x86_64-apple-darwin
      - name: Stage the app binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/bforge dist/bforge-macos-x86_64
      - name: Upload the app binary
        uses: actions/upload-artifact@v4
        with:
          name: bforge-macos-x86_64
          path: dist/*
          retention-days: 7

  ui:
    name: ui unit, build and headless smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Unit tests (vitest)
        working-directory: ui
        run: pnpm test
      - name: Production build (tsc + vite)
        working-directory: ui
        run: pnpm run build
      - name: Start the dev server
        working-directory: ui
        run: |
          pnpm run dev --port 5173 --strictPort &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5173/ > /dev/null || { echo "dev server did not come up"; exit 1; }
      - name: Headless UI smoke (15 checks)
        working-directory: ui
        run: pnpm smoke

  e2e:
    name: e2e bridge, REC and X/YMODEM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux serial headers
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine
        run: cargo build -p bforge-cli --locked
      - name: Bridge / REC e2e (9 checks)
        run: python e2e/e2e_bridge_rec.py target/debug/bforge.exe
      - name: Let the previous engine's sockets tear down
        run: sleep 3
      - name: X/YMODEM e2e (14 checks)
        run: python e2e/e2e_xmodem.py target/debug/bforge.exe
      - name: Duration exit + device reconnect e2e (4 checks)
        run: python e2e/e2e_duration_exit.py target/debug/bforge.exe
