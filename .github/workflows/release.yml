name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Empty when the repository has no certificate, which skips the signing steps.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Public preview label. Remove this entry if GitHub does not offer it.
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Build the app
        run: cargo build --release --locked -p bforge-cli --target ${{ matrix.target }}
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist
          base="target/${{ matrix.target }}/release/bforge"
          if [ -f "$base.exe" ]; then
            cp "$base.exe" "dist/bforge-${{ matrix.name }}.exe"
          else
            cp "$base" "dist/bforge-${{ matrix.name }}"
          fi
      - name: Sign the Windows binary
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          # `.pfx` as base64 in the secret; signtool ships with the runner's Windows SDK.
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          & signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
          Remove-Item $pfx
      - name: Sign the macOS binary
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-keychain-settings -lut 900 build.keychain
          security unlock-keychain -p build build.keychain
          codesign --force --options runtime --timestamp             --sign "$MACOS_IDENTITY" "dist/bforge-${{ matrix.name }}"
          rm -f cert.p12
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: bforge-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List what will be published
        run: ls -l dist
      - name: Write the checksums
        working-directory: dist
        run: |
          # A reader can check a download without trusting the transport, which is the
          # one part of trust that needs no certificate.
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # The notes come from the commits since the previous tag.
          gh release create "$tag" dist/* \
            --title "BaudForge $tag" \
            --generate-notes

  desktop:
    name: desktop installer (windows)
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the frontend
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the installer
        working-directory: crates/bforge-gui
        run: ../../ui/node_modules/.bin/tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Sign the installer
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          & signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          Remove-Item $pfx
      - name: Attach the installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $installer.FullName --clobber
