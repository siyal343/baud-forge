name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Public preview label. Remove this entry if GitHub does not offer it.
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux serial headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Build the app
        run: cargo build --release --locked -p bforge-cli --target ${{ matrix.target }}
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist
          base="target/${{ matrix.target }}/release/bforge"
          if [ -f "$base.exe" ]; then
            cp "$base.exe" "dist/bforge-${{ matrix.name }}.exe"
          else
            cp "$base" "dist/bforge-${{ matrix.name }}"
          fi
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: bforge-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List what will be published
        run: ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # The notes come from the commits since the previous tag.
          gh release create "$tag" dist/* \
            --title "BaudForge $tag" \
            --generate-notes
