<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BaudForge">
  <defs>
    <clipPath id="tileClip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10203c"/>
      <stop offset="1" stop-color="#0a1526"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>

  <!-- drafting grid -->
  <g clip-path="url(#tileClip)" stroke="#4a7dbb" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M80,16 V496 M144,16 V496 M208,16 V496 M272,16 V496 M336,16 V496 M400,16 V496 M464,16 V496"/>
    <path d="M16,80 H496 M16,144 H496 M16,208 H496 M16,272 H496 M16,336 H496 M16,400 H496 M16,464 H496"/>
  </g>
  <rect x="18.5" y="18.5" width="475" height="475" rx="110" fill="none" stroke="#7ea8d8" stroke-opacity="0.18" stroke-width="3"/>

  <g transform="translate(18,0)">
    <!-- serial pulse -->
    <g fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M110,156 H160 V108 H218 V156 H276 V108 H334 V156 H376"/>
    </g>
    <circle cx="398" cy="156" r="9" fill="#fbbf24"/>

    <!-- anvil line-work -->
    <g fill="#9db8dc" fill-opacity="0.07" stroke="#9db8dc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120,190 C96,192 72,198 52,208 C72,222 96,236 120,240 L398,240 C412,240 422,230 422,215 C422,200 412,190 398,190 Z"/>
      <path d="M226,240 H278 L268,326 H236 Z"/>
      <path d="M206,326 H298 L322,378 H182 Z"/>
      <rect x="168" y="378" width="180" height="34" rx="10"/>
    </g>
    <!-- centerline detail -->
    <path d="M60,215 H412" stroke="#9db8dc" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 8"/>
  </g>
</svg>
